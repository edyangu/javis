<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javis - Organiser Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>JAVIS</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="privacy.html">Privacy &amp; Terms</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>Organiser Login</h2>
    <p class="muted">
      Create an account to manage your event, prices, and sold tickets.
    </p>

    <label for="login-email">Email</label>
    <input id="login-email" type="email" placeholder="you@example.com">

    <label for="login-password">Password</label>
    <input id="login-password" type="password" placeholder="Password (min 6 characters)">

    <p id="login-error" class="error"></p>

    <button onclick="handleLogin()">Login</button>
    <button class="secondary" onclick="handleRegister()">Create Account</button>
  </div>
</main>

<footer>Javis Ticketing Demo</footer>

<script type="module" src="js/auth.js"></script>
<script src="js/consent.js"></script>
</body>
</html>
